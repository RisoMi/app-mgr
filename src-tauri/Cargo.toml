[package]
name = "app-mgr"
version = "0.1.0"
description = "Lightweight cross-platform launcher"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_mgr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
