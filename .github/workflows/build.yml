name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Windows 只出便携版：--no-bundle 直接产出免安装 exe，不做 MSI/NSIS 安装器。
      # 数据目录由 Rust 侧放在 exe 同级 data/，拷走整个目录即带走配置。
      - name: Build Windows portable exe
        if: matrix.os == 'windows-latest'
        run: pnpm tauri build --no-bundle

      - name: Name Windows portable artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Copy-Item src-tauri/target/release/app-mgr.exe AppMgr-portable.exe

      # macOS 出 dmg。当前未签名（需要 Apple 开发者账号 + 公证 secrets），
      # 可用于真机验证，不能直接对外分发。
      - name: Build macOS dmg
        if: matrix.os == 'macos-latest'
        run: pnpm tauri build --bundles dmg

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: appmgr-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            AppMgr-portable.exe
            src-tauri/target/release/bundle/dmg/*.dmg
