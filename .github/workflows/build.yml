name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Tauri 2 打包：Windows 走 WebView2（runner 自带），macOS 走 WKWebView（Xcode CLT 自带）。
      # 不指定 --target，用 runner 原生架构，产物固定落在 src-tauri/target/release/bundle/。
      - name: Build desktop bundle
        run: pnpm tauri build

      # 签名公证（第二阶段，需要 Apple 开发者账号）：
      #   secrets.APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_ID /
      #   APPLE_PASSWORD / APPLE_TEAM_ID → 由 tauri-action 在 tag 时读取并公证。
      # 当前产出未签名包，可用于真机验证，不能直接对外分发。
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: appmgr-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
