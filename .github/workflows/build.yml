name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Windows 只出便携版：--no-bundle 直接产出免安装 exe，不做 MSI/NSIS 安装器。
      # 数据目录由 Rust 侧放在 exe 同级 data/，拷走整个目录即带走配置。
      - name: Build Windows portable exe
        if: matrix.os == 'windows-latest'
        run: pnpm tauri build --no-bundle

      - name: Name Windows portable artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Copy-Item src-tauri/target/release/app-mgr.exe AppMgr-portable.exe

      # macOS 出 dmg。当前未签名（需要 Apple 开发者账号 + 公证 secrets），
      # 可用于真机验证，不能直接对外分发。
      - name: Build macOS dmg
        if: matrix.os == 'macos-latest'
        run: pnpm tauri build --bundles dmg

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: appmgr-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            AppMgr-portable.exe
            src-tauri/target/release/bundle/dmg/*.dmg

  # Releases 是独立功能：upload-artifact 只把包放进 Actions run，不会出现在 Releases 页。
  # 这里只在 v* tag 推送时汇总两个平台的产物、生成正式 Release；
  # 普通 push / workflow_dispatch 仍然只出 artifact，不对外发布。
  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows portable exe
        uses: actions/download-artifact@v4
        with:
          name: appmgr-windows-latest
          path: artifacts/windows

      - name: Download macOS dmg
        uses: actions/download-artifact@v4
        with:
          name: appmgr-macos-latest
          path: artifacts/macos

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          DMG=$(find artifacts/macos -name '*.dmg' | head -1)
          test -n "$DMG" || { echo "macOS dmg not found"; exit 1; }
          gh release create "$TAG" \
            "artifacts/windows/AppMgr-portable.exe#AppMgr-portable-Windows-x86_64.exe" \
            "$DMG#AppMgr-${TAG}-macOS-aarch64.dmg" \
            --title "AppMgr $TAG" \
            --notes "Windows: 便携版 exe，免安装；数据落在 exe 同级 data/ 目录。
          macOS: Apple Silicon (aarch64) dmg；当前未签名未公证，首次打开需右键 → 打开。
          这是 CI 自动构建产物，用于真机验证，尚未做正式代码签名与公证。"
